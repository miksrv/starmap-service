name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# Least-privilege token: the workflow only reads the repository.
permissions:
  contents: read

# Cancel a running check when new commits are pushed to the same ref/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    # Skip draft PRs; push to main always runs
    if: github.event_name == 'push' || github.event.pull_request.draft == false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check formatting (black)
        run: black --check --line-length 120 .

      - name: Check import order (isort)
        run: isort --check-only --profile black --line-length 120 .

      - name: Lint with pylint
        run: pylint $(git ls-files '*.py' | grep -v '^tests/')

      - name: Run tests
        run: pytest tests/ -v
