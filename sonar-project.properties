# SonarCloud project configuration.
# Project/organization keys come from SonarCloud (Administration → Update Key).
sonar.projectKey=miksrv_starmap-service
sonar.organization=miksoft

# Source layout.
sonar.sources=src,main.py
sonar.tests=tests
sonar.python.version=3.11

# Coverage: pytest --cov-report=xml writes coverage.xml at the repo root.
sonar.python.coverage.reportPaths=coverage.xml

# Don't count tests, vendored data, or generated output toward duplication/coverage.
sonar.exclusions=data/**,output/**,scripts/**,systemd/**
sonar.coverage.exclusions=tests/**,main.py
